name: Build Noor AlThikr APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o "NoorAlThikr-Final-Name-Icon-Audio-Notice (1).zip" -d project
          ls -la project

      - name: Locate Android project
        run: |
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          cd project
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-AlThikr-Final
          path: project/app/build/outputs/apk/debug/app-debug.apk
